services:
  - type: web
    name: telegram-ads-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: MONETAG_ZONE_ID
        sync: false
      - key: MONETAG_POSTBACK_SECRET
        sync: false
      - key: MONETAG_DEMO_MODE
        value: "false"
      - key: WEBAPP_URL
        sync: false
